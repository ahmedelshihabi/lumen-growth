<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumen Growth</title>
    <meta name="description" content="Ads dashboard for Egypt and the Gulf (Meta today, Google Ads and TikTok soon): ROAS, CPA, budget pacing, creative fatigue, alerts and recommendations." />
    <script>
      try {
        // Language before first paint (Arabic/RTL by default) to avoid a layout flip.
        var q = new URLSearchParams(location.search).get('lang');
        var l = q === 'en' || q === 'ar' ? q : localStorage.getItem('lumen.lang');
        if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
        var t = localStorage.getItem('lumen.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
